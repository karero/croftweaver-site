name: CI
# Runs astro check (strict TS) + the full quality harness (a11y / seo / navigation /
# images / tone / positioning / email / links) against a production build. A red check blocks the
# merge — the point. Needs a committed package-lock.json (npm ci).
# node-version 24: keep in sync with .nvmrc. Astro itself needs Node >=22.12, the floor in package.json's engines.
on:
  push:
    branches: [main, production]
  pull_request:
  workflow_dispatch:

# The token these jobs get can read the repository and nothing else. They check out the code and run
# the tests; nothing here writes to GitHub, so nothing more is granted, whatever the repository's own
# default for the workflow token is.
permissions:
  contents: read

# One run per branch at a time: a newer push to the same branch cancels the run it
# supersedes. Saves Actions minutes (a private repo has 2 000 free per month; each run
# here is ~5 min) and means the green tick always belongs to the latest commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job id `test` is the check name a branch ruleset requires (website-team-setup
  # §5-A: required_status_checks context "test"). Renaming or splitting this job
  # without updating the ruleset blocks every merge — a check that never reports
  # never passes.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Content placeholders must never merge (AGENTS.md §2/§4): a missing fact is
      # written as "[MISSING: …]" so it can be found, and this is where it is found.
      # Runs before the build so it fails in ~1s. Template [BRACKET] slots (privacy
      # page, manifest) are a scaffold-time convention checked by the launch
      # checklist, not here.
      # Translated site (AGENTS.md uses e.g. "[FEHLT: …]")? Put that token in the
      # pattern below, or the gate greps for a word nobody writes.
      # Two guards, two jobs: the folder loop names a missing folder in plain words;
      # the `case` reads grep's tri-state exit (0 found, 1 nothing, >=2 error such as
      # an unreadable file) so an error cannot pass as "nothing found" — grep may have
      # printed matches before erroring. `-I` skips binaries (a PDF or font in public/
      # that happens to contain the bytes would otherwise fail the gate with nothing
      # to fill). The run step is `bash -e`, hence `|| rc=$?`.
      - name: No unfilled "[MISSING:" placeholders
        run: |
          for d in src public; do
            [ -d "$d" ] || { echo "::error::$d/ not found — the placeholder gate cannot run"; exit 1; }
          done
          rc=0
          grep -rnI '\[MISSING:' src public || rc=$?
          case "$rc" in
            1) echo "no placeholders" ;;
            0) echo '::error::unfilled "[MISSING: …]" placeholder(s) listed above — fill them before merging'; exit 1 ;;
            *) echo "::error::grep failed (exit $rc) — the placeholder gate did not run"; exit 1 ;;
          esac
      # Needs no build, no browser and no network, so it runs first and fails in ~1s.
      # The pre-push hook runs it too, but a hook is bypassable with --no-verify and
      # is absent in a clone that has not run `npm install` yet.
      - name: Publish classifier (scripts/ship.sh)
        run: bash tests/check_ship_push.sh
      - name: AI check export (scripts/export-ai-check.py)
        run: bash tests/check_export_ai_check.sh
      - name: Case study export (scripts/export-own-site.py)
        run: bash tests/check_export_own_site.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Reads public/.well-known/security.txt, src/config.ts and tests/_helpers.ts, and runs `node` for the
      # date maths. Not for Dependabot's own pull requests: an Expires date that has run out must not hold up
      # a security update. It still runs on the push that merges them, and the pre-push hook runs it too.
      # So an expired or 7-days-away file also holds up `npm run ship`. That delay is accepted: the message
      # names the fix (edit Expires), and `git push --no-verify` skips the hook for one push.
      # The condition follows GitHub's documentation of Dependabot with Actions, whose examples test
      # github.event.pull_request.user.login (https://docs.github.com/en/code-security/dependabot/working-with-dependabot/automating-dependabot-with-github-actions,
      # read 2026-10-22), and it names the event first, so that it never depends on what a missing pull
      # request evaluates to. Not run on GitHub: Actions cannot run locally, so only the YAML parse and the
      # expression have been read.
      - name: security.txt (public/.well-known/security.txt)
        if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
        run: bash tests/check_security_txt.sh
      # Four builds with CF_PAGES_BRANCH set four ways: the Plausible script is on the live
      # build only. The Playwright run below builds once and cannot see a wrong switch.
      - name: Analytics gate (src/config.ts)
        run: bash tests/check_analytics_gate.sh
      - run: npm run check
      # The /security page check reads dist/security.html and refuses a stale build. No earlier step builds
      # dist/: the analytics gate builds into temporary folders and leaves dist/ alone. So build it here for
      # the check. (`npm test` builds again for Playwright.)
      - run: npm run build
      - name: /security claims (src/data/security.ts)
        run: bash tests/check_security_page.sh
      - run: npx playwright install --with-deps chromium
      - run: npm test
